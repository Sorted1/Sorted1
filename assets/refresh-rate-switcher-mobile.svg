<svg xmlns="http://www.w3.org/2000/svg" width="380" height="164" viewBox="0 0 380 164" role="img" aria-labelledby="title desc">
  <title id="title">Refresh Rate Switcher</title><desc id="desc">Display control for FPGA image-fuser setups.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16111e"/><stop offset="1" stop-color="#0a090e"/></linearGradient></defs>
  <style>
    .scan { animation: scan 2.8s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes scan { from { transform: translateY(-10px); opacity: .2; } to { transform: translateY(12px); opacity: .9; } }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scan,.pulse { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="379" height="163" rx="17" fill="url(#bg)" stroke="#514068"/>
  <rect x="294" y="17" width="61" height="43" rx="5" fill="#110e19" stroke="#bd8cf1" stroke-width="1.5"/>
  <path class="scan" d="M300 37h49" stroke="#dcbaff" stroke-width="2"/>
  <rect x="315" y="30" width="20" height="19" rx="3" fill="#17111f" stroke="#7955a4" stroke-opacity=".55"/>
  <text class="pulse" x="324" y="45" text-anchor="middle" fill="#f8efff" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">Hz</text>
  <path d="M318 61v5m12-5v5m-21 0h30" stroke="#bd8cf1" stroke-width="1.5"/>
  <text x="19" y="29" fill="#b68bdf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">04 / WINDOWS</text>
  <text x="18" y="77" fill="#f8f5ff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="-1">Refresh Rate Switcher</text>
  <text x="19" y="105" fill="#c8bdcf" font-family="Arial,Helvetica,sans-serif" font-size="15">Display control for FPGA</text>
  <text x="19" y="125" fill="#c8bdcf" font-family="Arial,Helvetica,sans-serif" font-size="15">image-fuser setups.</text>
  <text x="19" y="151" fill="#c394f3" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">PYTHON + WIN32  /  VIEW REPO ↗</text>
</svg>
