<svg xmlns="http://www.w3.org/2000/svg" width="760" height="234" viewBox="0 0 760 234" role="img" aria-labelledby="title desc">
  <title id="title">Sorted on GitHub</title>
  <desc id="desc">Sorted, @Sorted1. Runs Storm Development.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17131f"/><stop offset="1" stop-color="#0b0a10"/></linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241a36"/><stop offset="1" stop-color="#08070d"/></linearGradient>
