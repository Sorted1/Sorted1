  <style>
    .ring { animation: turn 24s linear infinite; transform-origin: 100px 112px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .trace { animation: trace 4s ease-in-out infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes trace { 0%,100% { opacity: .28; } 50% { opacity: .8; } }
    @media (prefers-reduced-motion: reduce) { .ring,.cursor,.trace { animation: none; } }
  </style>
