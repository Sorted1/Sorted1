<svg xmlns="http://www.w3.org/2000/svg" width="380" height="164" viewBox="0 0 380 164" role="img" aria-labelledby="title desc">
  <title id="title">Watson</title><desc id="desc">Email, IP, and carrier lookups. Extensible commands.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16111e"/><stop offset="1" stop-color="#0a090e"/></linearGradient></defs>
  <style>
    .scan { animation: scan 3.5s ease-in-out infinite alternate; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes scan { from { transform: translateY(-12px); opacity: .2; } to { transform: translateY(12px); opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .scan,.pulse { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="379" height="163" rx="17" fill="url(#bg)" stroke="#514068"/>
  <circle cx="323" cy="37" r="22" fill="none" stroke="#bc8bed" stroke-opacity=".65"/>
  <circle cx="323" cy="37" r="10" fill="none" stroke="#e0c2ff" stroke-opacity=".7"/>
  <path class="scan" d="M298 37h50" stroke="#d3aaff" stroke-width="2"/>
  <path d="m338 52 13 13" stroke="#d3aaff" stroke-width="5" stroke-linecap="round"/>
  <circle class="pulse" cx="323" cy="37" r="3" fill="#fff"/>
  <text x="19" y="29" fill="#b68bdf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">03 / OSINT</text>
  <text x="18" y="77" fill="#f8f5ff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="-1">Watson</text>
  <text x="19" y="105" fill="#c8bdcf" font-family="Arial,Helvetica,sans-serif" font-size="15">Email, IP, and carrier lookups.</text>
  <text x="19" y="125" fill="#c8bdcf" font-family="Arial,Helvetica,sans-serif" font-size="15">Extensible commands.</text>
  <text x="19" y="151" fill="#c394f3" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">PYTHON  /  VIEW REPO ↗</text>
</svg>
