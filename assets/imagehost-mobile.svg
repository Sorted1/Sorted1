<svg xmlns="http://www.w3.org/2000/svg" width="380" height="164" viewBox="0 0 380 164" role="img" aria-labelledby="title desc">
  <title id="title">ImageHost</title><desc id="desc">An image upload endpoint for a ShareX workflow.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16111e"/><stop offset="1" stop-color="#0a090e"/></linearGradient></defs>
  <style>
    .upload { animation: upload 2.8s ease-in-out infinite; }
    .progress { animation: progress 2.8s ease-in-out infinite; transform-origin: 300px 57px; }
    @keyframes upload { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-5px); opacity: 1; } }
    @keyframes progress { 0% { transform: scaleX(.2); } 80%,100% { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .upload,.progress { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="379" height="163" rx="17" fill="url(#bg)" stroke="#514068"/>
  <rect x="294" y="17" width="61" height="48" rx="5" fill="#110e19" stroke="#bd8cf1" stroke-width="1.5"/>
  <path d="M294 28h61" stroke="#bd8cf1" stroke-opacity=".6"/>
  <circle cx="301" cy="23" r="2" fill="#cd9efa"/>
  <g class="upload"><path d="M325 35v17m-7-10 7-7 7 7" fill="none" stroke="#f0ddff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path class="progress" d="M300 57h49" stroke="#c790f8" stroke-width="2" stroke-linecap="round"/>
  <text x="19" y="29" fill="#b68bdf" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">05 / SELF-HOSTED</text>
  <text x="18" y="77" fill="#f8f5ff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="-1">ImageHost</text>
  <text x="19" y="105" fill="#c8bdcf" font-family="Arial,Helvetica,sans-serif" font-size="15">Image uploads for ShareX.</text>
  <text x="19" y="125" fill="#c8bdcf" font-family="Arial,Helvetica,sans-serif" font-size="15">Flask, self-hosted.</text>
  <text x="19" y="151" fill="#c394f3" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">FLASK + SHAREX  /  VIEW REPO ↗</text>
</svg>
