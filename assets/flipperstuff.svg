    @keyframes wave { 0%,100% { opacity: .22; } 50% { opacity: .9; } }
    @keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .radio1,.radio2,.pixel { animation: none; } }
