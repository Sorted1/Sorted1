<svg xmlns="http://www.w3.org/2000/svg" width="760" height="170" viewBox="0 0 760 170" role="img" aria-labelledby="title desc">
  <title id="title">FlipperStuff</title><desc id="desc">Flipper Zero apps and scripts from many creators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15111d"/><stop offset="1" stop-color="#0a090e"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9256e5" stop-opacity=".3"/><stop offset="1" stop-color="#9256e5" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect x="1" y="1" width="758" height="168" rx="18"/></clipPath>
